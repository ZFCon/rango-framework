[package]
name = "rangoframework-middleware"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Rango request handling: middleware chain, built-in middleware, dev server."

[lib]
name = "rango_middleware"

[dependencies]
base64 = "0.23.1"
serde_json = "1.0.154"
md-5 = "0.11.0"
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["string"] }
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "http1", "http2"] }
indexmap = "2.14.2"
inventory = "0.3.25"
rango-core = { package = "rangoframework-core", version = "0.1.0", path = "../rango-core" }
rango-http = { package = "rangoframework-http", version = "0.1.0", path = "../rango-http" }
rango-template = { package = "rangoframework-template", version = "0.1.0", path = "../rango-template" }
rango-urls = { package = "rangoframework-urls", version = "0.1.0", path = "../rango-urls" }
rango-views = { package = "rangoframework-views", version = "0.1.0", path = "../rango-views" }
regex = "1.13.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
