<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Rango: a rust-coloured lizard inside a gear">
  <title>Rango</title>
  <!-- gear ring: the nod to Rust -->
  <g fill="#8f3a14">
    <g id="teeth">
      <path d="M118 6h20l4 22h-28z"/>
      <path d="M118 6h20l4 22h-28z" transform="rotate(30 128 128)"/>
      <path d="M118 6h20l4 22h-28z" transform="rotate(60 128 128)"/>
      <path d="M118 6h20l4 22h-28z" transform="rotate(90 128 128)"/>
      <path d="M118 6h20l4 22h-28z" transform="rotate(120 128 128)"/>
      <path d="M118 6h20l4 22h-28z" transform="rotate(150 128 128)"/>
      <path d="M118 6h20l4 22h-28z" transform="rotate(180 128 128)"/>
      <path d="M118 6h20l4 22h-28z" transform="rotate(210 128 128)"/>
      <path d="M118 6h20l4 22h-28z" transform="rotate(240 128 128)"/>
      <path d="M118 6h20l4 22h-28z" transform="rotate(270 128 128)"/>
      <path d="M118 6h20l4 22h-28z" transform="rotate(300 128 128)"/>
      <path d="M118 6h20l4 22h-28z" transform="rotate(330 128 128)"/>
    </g>
  </g>
  <circle cx="128" cy="128" r="96" fill="none" stroke="#8f3a14" stroke-width="18"/>
  <circle cx="128" cy="128" r="87" fill="#fff4ea"/>

  <!-- lizard, seen from above, curled along the ring -->
  <g transform="translate(2 16) scale(0.9)">
  <!-- tail: tapers into a spiral -->
  <path d="M112 150c-18 14-40 12-48-4s2-36 20-36 26 16 16 26-22 2-18-8"
        fill="none" stroke="#b7410e" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- legs -->
  <g fill="none" stroke="#8f3a14" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M124 150l-6 24 14 8"/>
    <path d="M150 120l22 12 -4 16"/>
    <path d="M132 112l-22-10 2-16"/>
    <path d="M160 92l22-6 10 12"/>
  </g>
  <!-- toes -->
  <g fill="#8f3a14">
    <circle cx="135" cy="184" r="5"/><circle cx="167" cy="150" r="5"/><circle cx="112" cy="84" r="5"/><circle cx="194" cy="100" r="5"/>
  </g>
  <!-- body and head -->
  <path d="M108 156c6-30 26-58 52-74 8-5 14-14 18-22 4-9 16-12 24-5s8 20 0 28c-6 6-16 8-24 10-22 8-38 30-44 58-2 10-12 16-20 12s-8-4-6-7z" fill="#b7410e"/>
  <!-- back markings -->
  <g fill="#de8a5c">
    <circle cx="134" cy="128" r="6"/><circle cx="146" cy="110" r="5.5"/><circle cx="160" cy="96" r="5"/><circle cx="124" cy="146" r="5"/>
  </g>
  <!-- eyes -->
  <circle cx="186" cy="62" r="6.5" fill="#fff4ea"/><circle cx="187" cy="61" r="3" fill="#3a1608"/>
  <circle cx="203" cy="78" r="6.5" fill="#fff4ea"/><circle cx="204" cy="77" r="3" fill="#3a1608"/>
  </g>
</svg>
