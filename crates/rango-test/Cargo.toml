[package]
name = "rangoframework-test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Rango test utilities: Client, RequestFactory, response assertions."

[lib]
name = "rango_test"

[dependencies]
bytes = "1.12.1"
futures-util = "0.3.34"
indexmap = "2.14.2"
rango-core = { package = "rangoframework-core", version = "0.1.0", path = "../rango-core" }
rango-http = { package = "rangoframework-http", version = "0.1.0", path = "../rango-http" }
rango-middleware = { package = "rangoframework-middleware", version = "0.1.0", path = "../rango-middleware" }
rango-urls = { package = "rangoframework-urls", version = "0.1.0", path = "../rango-urls" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
