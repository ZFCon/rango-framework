[package]
name = "rangoframework-http"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Rango HTTP layer: requests, responses, cookies, query dicts, uploads."

[lib]
name = "rango_http"

[dependencies]
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
fancy-regex = "0.20.2"
futures-util = "0.3.34"
http = "1.5.0"
indexmap = { version = "2.14.2", features = ["serde"] }
mime_guess = "2.0.5"
multer = "3.1.0"
rango-core = { package = "rangoframework-core", version = "0.1.0", path = "../rango-core" }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "sync", "fs", "io-util"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
