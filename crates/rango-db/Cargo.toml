[package]
name = "rangoframework-db"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Rango ORM: models, QuerySets, SQLite/PostgreSQL backends."

[lib]
name = "rango_db"

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
clap = "4.6.7"
futures-util = "0.3.34"
indexmap = { version = "2.14.2", features = ["serde"] }
inventory = "0.3.25"
rango-core = { package = "rangoframework-core", version = "0.1.0", path = "../rango-core" }
rango-macros = { package = "rangoframework-macros", version = "0.1.0", path = "../rango-macros" }
regex = "1.13.1"
rusqlite = { version = "0.42.0", features = ["bundled", "chrono", "uuid", "serde_json", "functions"] }
rust_decimal = { version = "1.43.0", features = ["db-tokio-postgres"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-postgres = { version = "0.7.18", features = ["with-chrono-0_4", "with-uuid-1", "with-serde_json-1"] }
uuid = "1.29.2"

[dev-dependencies]
chrono = "0.4.45"
futures-util = "0.3.34"
rust_decimal = "1.43.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
