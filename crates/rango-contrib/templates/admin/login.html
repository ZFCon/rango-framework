{% extends "admin/base.html" %}
{% block content %}
<h2>Log in</h2>
{% if error %}<p class="errorlist">{{ error }}</p>{% endif %}
<form method="post" action="{{ admin_url }}login/">{% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  <div class="form-row"><label for="id_username">Username:</label> <input type="text" name="username" id="id_username" autofocus required></div>
  <div class="form-row"><label for="id_password">Password:</label> <input type="password" name="password" id="id_password" required></div>
  <p><input type="submit" class="default" value="Log in"></p>
</form>
{% endblock %}
