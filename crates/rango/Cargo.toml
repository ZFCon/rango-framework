[package]
name = "rangoframework"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description.workspace = true

[lib]
name = "rango"

[dependencies]
rango-cli = { package = "rangoframework-cli", version = "0.1.0", path = "../rango-cli" }
rango-contrib = { package = "rangoframework-contrib", version = "0.1.0", path = "../rango-contrib" }
rango-core = { package = "rangoframework-core", version = "0.1.0", path = "../rango-core" }
rango-db = { package = "rangoframework-db", version = "0.1.0", path = "../rango-db" }
rango-forms = { package = "rangoframework-forms", version = "0.1.0", path = "../rango-forms" }
rango-http = { package = "rangoframework-http", version = "0.1.0", path = "../rango-http" }
rango-template = { package = "rangoframework-template", version = "0.1.0", path = "../rango-template" }
rango-middleware = { package = "rangoframework-middleware", version = "0.1.0", path = "../rango-middleware" }
rango-rest = { package = "rangoframework-rest", version = "0.1.0", path = "../rango-rest" }
rango-test = { package = "rangoframework-test", version = "0.1.0", path = "../rango-test" }
rango-urls = { package = "rangoframework-urls", version = "0.1.0", path = "../rango-urls" }
rango-views = { package = "rangoframework-views", version = "0.1.0", path = "../rango-views" }

serde_json = "1.0.154"

[dev-dependencies]
async-trait = "0.1"
bytes = "1.12.1"
clap = "4"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
